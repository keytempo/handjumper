name: Set up Python build environment
description: >-
  Installs the pinned Python version and the project's build dependencies,
  with pip caching. Does NOT check out the repository — the calling job must
  do that first (a local composite action can only be resolved once the repo
  containing it is already on disk).

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
        cache: pip
        cache-dependency-path: archive/requirements.txt

    - name: Install dependencies
      shell: bash
      run: python -m pip install --requirement archive/requirements.txt
